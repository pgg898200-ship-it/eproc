    <text x="573" y="87" font-size="20" fill="#f5cf80">Threshold 20</text>
    <text x="573" y="145" font-size="30" font-weight="700">41 scores</text>
    <text x="573" y="171" font-size="17" fill="#e8d5f2">First crossing</text>
  </g>
