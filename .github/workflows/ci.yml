name: eproc-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-c-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C11 core (native AVX2 + portable runtime-AVX2 + scalar) & verify 3-way 0-ULP + 0 alloc
        run: make test

      - name: Run ASan + UBSan + float-cast-overflow suite
        run: make test-asan

      - name: Run TSan concurrent Boehm-2012 seqlock suite
        run: make test-tsan

      - name: Verify portable single-header C11 and C++17 compilation
        run: |
          python3 scripts/make_single_header.py
          cc -std=c11 -O3 -ffp-contract=off -Wall -Wextra -Werror -x c - -lm -o /tmp/test_sh_c <<'EOF'
          #define EPROC_IMPLEMENTATION
          #include "dist/eproc_single.h"
          #include <assert.h>
          int main(void) {
              eproc_bet_t ep;
              eproc_bet_result_t res;
              assert(eproc_bet_init(&ep, 0.5, 0.05, 0.0, 1.0, EPROC_SIDE_UPPER) == EPROC_OK);
              assert(eproc_bet_update(&ep, 1.0, &res) == EPROC_OK);
              assert(res.n == 1);
              return 0;
          }
          EOF
          /tmp/test_sh_c
          c++ -std=c++17 -O3 -ffp-contract=off -Wall -Wextra -Werror -x c++ - -lm -o /tmp/test_sh_cpp <<'EOF'
          #define EPROC_IMPLEMENTATION
          #include "dist/eproc_single.h"
          #include <cassert>
          int main() {
              eproc_bet_t ep;
              eproc_bet_result_t res;
              assert(eproc_bet_init(&ep, 0.5, 0.05, 0.0, 1.0, EPROC_SIDE_UPPER) == EPROC_OK);
              assert(eproc_bet_update(&ep, 1.0, &res) == EPROC_OK);
              assert(res.n == 1);
              return 0;
          }
          EOF
          /tmp/test_sh_cpp

      - name: Build CPython _native accelerator, verify release hygiene & SHA256SUMS
        run: |
          python3 scripts/build_pyext.py
          python3 scripts/verify_release_hygiene.py --strict
          sha256sum -c SHA256SUMS

      - name: Run Python API + Adapters (native & ctypes fallback) & 42-test Adversarial Breaker
        run: |
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_python_api.py" -v
          EPROC_DISABLE_NATIVE=1 PYTHONPATH=python python3 -m unittest discover -s tests -p "test_python_api.py" -v
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_adapters.py" -v
          EPROC_DISABLE_NATIVE=1 PYTHONPATH=python python3 -m unittest discover -s tests -p "test_adapters.py" -v
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_breaker.py" -v

      - name: Verify self-contained portable pip wheel install (runtime AVX2 + ctypes fallback)
        run: |
          python3 -m venv /tmp/eproc_ci_venv
          /tmp/eproc_ci_venv/bin/pip install --no-deps .
          cd /tmp
          /tmp/eproc_ci_venv/bin/eproc version
          /tmp/eproc_ci_venv/bin/python -c "import eproc; ep=eproc.EProcess(0.5,0.05); r=ep.update_batch([1.0]*40); assert r.rejected"
          EPROC_DISABLE_NATIVE=1 /tmp/eproc_ci_venv/bin/python -c "import eproc; ep=eproc.EProcess(0.5,0.05); r=ep.update_batch([1.0]*40); assert r.rejected"

  verify-multilang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libeproc.so for WASM/C11 parity tests
        run: make libeproc.so

      - name: Verify WebAssembly (dist/eproc.wasm) & Node.js ES module tests
        run: node --test js/test_wasm.mjs

      - name: Verify zero-dep Rust crate (cargo test --release -D warnings)
        run: RUSTFLAGS="-D warnings" cargo test --manifest-path rust/eproc/Cargo.toml --release

      - name: Verify zero-dep Go CGo package (go vet + go test -race)
        working-directory: go/eproc
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Verify CMake static + shared builds and CTest
        run: |
          cmake -S . -B /tmp/eproc_cmake_static -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/eproc_cmake_static
          ctest --test-dir /tmp/eproc_cmake_static --output-on-failure
          cmake -S . -B /tmp/eproc_cmake_shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/eproc_cmake_shared
          ctest --test-dir /tmp/eproc_cmake_shared --output-on-failure
