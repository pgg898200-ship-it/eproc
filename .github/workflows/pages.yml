name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "js/eproc.mjs"
      - "js/eproc.d.ts"
      - "llms.txt"
      - "llms-full.txt"
      - "dist/**"
      - "SHA256SUMS"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site + live C11 WASM + Ramp-style llms.txt endpoints
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/MATHEMATICS.md _site/MATHEMATICS.md
          cp docs/COMPARISON.md _site/COMPARISON.md
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp dist/eproc_single.h _site/eproc_single.h
          cp dist/eproc.wasm _site/eproc.wasm
          cp js/eproc.mjs _site/eproc.mjs
          cp js/eproc.d.ts _site/eproc.d.ts
          cp SHA256SUMS _site/SHA256SUMS
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
